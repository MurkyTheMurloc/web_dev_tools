name: Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

# Default for every job; the publish job raises exactly what it needs.
permissions:
  contents: read

jobs:
  # Installs, lints, typechecks, tests and builds. Runs the package scripts and
  # their dependencies, so it holds no write access and no OIDC token.
  verify:
    name: Verify and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: "package.json"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Lint, typecheck, tests and smoke checks of every published package;
      # the smoke scripts and the shadcn-lint step also build the dist folders.
      - name: Verify packages
        run: bun run release:verify

      # tar fails when a dist folder is missing, so a package that was not built
      # stops the workflow here and not at publish time.
      - name: Pack build output
        run: >-
          tar -cf "$RUNNER_TEMP/dist.tar"
          packages/typebuddy/dist
          packages/simplelog/dist
          packages/shadcn-lint/packages/lint/dist

      - name: Upload build output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: ${{ runner.temp }}/dist.tar
          if-no-files-found: error
          retention-days: 1

  # Opens the version PR or publishes to npm with trusted publishing. Dependencies
  # are installed with --ignore-scripts and the dist folders come from the verify
  # job; `changeset publish` still runs `npm publish`, which runs the packages' own
  # pack scripts (shadcn-lint prepack/postpack) while this job holds id-token.
  # Re-run the whole workflow, not only this job: the dist artifact keeps one day.
  publish:
    name: Version or publish
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the version branch and release tags
      pull-requests: write # open and update the version PR
      id-token: write # npm trusted publishing and provenance
    steps:
      # No persisted credentials: changesets/action v2 pushes the version branch
      # and the release tags through the GitHub API with its `github-token`, not
      # with `git push`, so nothing in this job needs the checkout's token.
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: "package.json"

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Download build output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: ${{ runner.temp }}

      - name: Unpack build output
        run: |
          tar -xf "$RUNNER_TEMP/dist.tar"
          rm "$RUNNER_TEMP/dist.tar"

      # With changesets pending the action runs `version-script` and opens or
      # updates the version PR; without any it runs `publish-script` (npm trusted
      # publishing) and pushes the release tags. Both push through the GitHub API
      # (`push-with-git-cli` stays at its default `false`): the version commit
      # carries every file the working tree changed since checkout, including
      # bun.lock and the JSR manifests `version-packages` regenerates, and
      # GitHub signs it. The action sets GITHUB_TOKEN for the scripts itself.
      - name: Create version PR or publish
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          create-github-releases: false
          push-git-tags: true
          publish-script: bun run publish:npm
          version-script: bun run version-packages
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
        env:
          NPM_CONFIG_PROVENANCE: "true"
