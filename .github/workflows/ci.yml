name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typebuddy:
    name: Typebuddy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: "package.json"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck typebuddy
        run: bun --cwd packages/typebuddy run typecheck

      - name: Lint typebuddy
        run: bun --cwd packages/typebuddy run lint

      - name: Test typebuddy
        run: bun --cwd packages/typebuddy run test

      - name: Smoke globals
        run: bun --cwd packages/typebuddy run smoke:globals

      - name: Smoke oxlint
        run: bun --cwd packages/typebuddy run smoke:oxlint

      - name: Smoke oxlint fix
        run: bun --cwd packages/typebuddy run smoke:oxlint:fix

      - name: Smoke treeshaking
        run: bun --cwd packages/typebuddy run smoke:treeshake

      - name: Smoke subpaths
        run: bun --cwd packages/typebuddy run smoke:subpath

  oxlint-plugin-solid:
    name: Oxlint plugin solid
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: "package.json"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test oxlint-plugin-solid
        run: bun --cwd packages/oxlint-plugin-solid run test

  shadcn-lint:
    name: shadcn-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: "package.json"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify shadcn-lint
        run: bun run release:verify:shadcn-lint
