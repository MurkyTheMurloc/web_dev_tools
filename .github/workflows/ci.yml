name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typebuddy:
    name: Typebuddy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: "package.json"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck typebuddy
        run: bun run --cwd packages/typebuddy typecheck

      - name: Lint typebuddy
        run: bun run --cwd packages/typebuddy lint

      - name: Test typebuddy
        run: bun run --cwd packages/typebuddy test

      # Guards against native checks in Chrome, where document.all exists. The
      # runner image ships Google Chrome; without it this fails instead of
      # skipping.
      - name: Test typebuddy in a browser
        run: bun run --cwd packages/typebuddy test:browser
        env:
          TYPEBUDDY_REQUIRE_BROWSER: "1"

      - name: Smoke globals
        run: bun run --cwd packages/typebuddy smoke:globals

      - name: Smoke oxlint
        run: bun run --cwd packages/typebuddy smoke:oxlint

      - name: Smoke oxlint fix
        run: bun run --cwd packages/typebuddy smoke:oxlint:fix

      - name: Smoke treeshaking
        run: bun run --cwd packages/typebuddy smoke:treeshake

      - name: Smoke subpaths
        run: bun run --cwd packages/typebuddy smoke:subpath

  simplelog:
    name: Simplelog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: "package.json"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify simplelog
        run: bun run release:verify:simplelog

  oxlint-plugin:
    name: Oxlint plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: "package.json"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test oxlint-plugin
        run: bun run --cwd packages/oxlint-plugin test

  oxlint-plugin-solid:
    name: Oxlint plugin solid
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: "package.json"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test oxlint-plugin-solid
        run: bun run --cwd packages/oxlint-plugin-solid test

  shadcn-lint:
    name: shadcn-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: "package.json"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify shadcn-lint
        run: bun run release:verify:shadcn-lint
